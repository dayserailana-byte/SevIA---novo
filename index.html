  });
  var max=Math.max.apply(null,ms.map(function(m){return m.v}).concat([1])),step=Math.max(1,Math.ceil(Math.max(4,max)/4)),yMax=step*4;
  var W=640,H=230,L=34,R=8,T=14,B=30,pw=W-L-R,ph=H-T-B,cw=pw/12,bw=cw*0.56,svg='';
  for(k=0;k<=4;k++){var y=T+ph-(k*step/yMax)*ph;svg+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+(k*step)+'</text>'}

/* ---------- dashboards: concluídas e indicadores ---------- */
function filtrados(){
  var min='';
  if(S.pf.periodo!=='tudo'){var d=new Date();d.setDate(d.getDate()-({'30d':30,'90d':90,'12m':365}[S.pf.periodo]));min=isoDate(d)}
  var fi=S.insp.filter(function(i){return (S.pf.empresa==='todas'||i.empresaId===S.pf.empresa)&&unOk(i)&&(!min||(i.data||'')>=min)});
  var is={};fi.forEach(function(i){is[i.id]=1});
  var fn=S.ncs.filter(function(n){return is[n.inspId]}),ns={};fn.forEach(function(n){ns[n.id]=1});
  var fa=S.acoes.filter(function(a){return ns[a.ncId]});
  return {fi:fi,fn:fn,fa:fa};
}
function dias(a,b){var x=String(a).split('-'),y=String(b).split('-');return Math.round((new Date(+y[0],+y[1]-1,+y[2])-new Date(+x[0],+x[1]-1,+x[2]))/86400000)}
function dataConc(i){var m='';ncsDe(i.id).forEach(function(n){acoesDe(n.id).forEach(function(a){if((a.concluidaEm||'')>m)m=a.concluidaEm})});return m||i.data}
function media(l){return l.length?Math.round(l.reduce(function(a,x){return a+x},0)/l.length):null}
function pct(a,b){return b?Math.round(a/b*100):0}
function serieMes(vals){
  var now=new Date(),ms=[],k;
  for(k=11;k>=0;k--){var d=new Date(now.getFullYear(),now.getMonth()-k,1);ms.push({key:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),l:MESES[d.getMonth()],v:0})}
  vals.forEach(function(d){var key=String(d||'').slice(0,7);ms.forEach(function(m){if(m.key===key)m.v++})});
  return ms;
}
function barrasMes(ms,aria){
  var max=Math.max.apply(null,ms.map(function(m){return m.v}).concat([1])),step=Math.max(1,Math.ceil(Math.max(4,max)/4)),yMax=step*4;
  var W=640,H=230,L=34,R=8,T=14,B=30,pw=W-L-R,ph=H-T-B,cw=pw/12,bw=cw*0.56,svg='',k;
  for(k=0;k<=4;k++){var y=T+ph-(k*step/yMax)*ph;svg+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+(k*step)+'</text>'}
  ms.forEach(function(m,i){
    var h=(m.v/yMax)*ph,x=L+i*cw+(cw-bw)/2,y2=T+ph-h;
    if(m.v)svg+='<rect class="br" x="'+x+'" y="'+y2+'" width="'+bw+'" height="'+h+'" rx="3"/><text class="vl" x="'+(x+bw/2)+'" y="'+(y2-4)+'" text-anchor="middle">'+m.v+'</text>';
    svg+='<text class="ax" x="'+(L+i*cw+cw/2)+'" y="'+(H-9)+'" text-anchor="middle">'+m.l+'</text>';
  });
  return '<svg class="evo" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(aria)+'">'+svg+'</svg>';
}
function tile(n,l,href,bad){return '<a class="tile" href="'+href+'"><span class="n'+(bad?' bad':'')+'">'+n+'</span><span class="l">'+l+'</span></a>'}
function viewConcluidas(){

  '<div class="cols"><section class="card"><div class="card-h"><h2>Situação das inspeções</h2></div>'+donut([{l:'Concluídas',v:C.length,c:'var(--ok)'},{l:'Em andamento',v:abertas-venc,c:'var(--info)'},{l:'Vencidas',v:venc,c:'var(--danger)'}],fi.length,'Inspeções',fi.length+' inspeções por situação')+'</section>'+

  '<section class="card"><div class="card-h"><h2>Lista de concluídas</h2></div><div class="list">'+(C.length?C.slice(0,30).map(function(c){var i=c.i;

function ixDonut(parts,center,sub,label){
  var C=263.9,tot=parts.reduce(function(a,x){return a+x.v},0),cum=0,c='';
  if(tot)parts.forEach(function(x){if(!x.v)return;var d=C*x.v/tot,g=parts.filter(function(y){return y.v}).length>1?1.5:0;c+='<circle cx="55" cy="55" r="42" fill="none" stroke="'+x.c+'" stroke-width="16" stroke-dasharray="'+(d-g).toFixed(1)+' '+(C-d+g).toFixed(1)+'" stroke-dashoffset="'+(-cum).toFixed(1)+'" transform="rotate(-90 55 55)"/>';cum+=d});
  return '<svg width="116" height="116" viewBox="0 0 110 110" role="img" aria-label="'+esc(label)+'"><circle cx="55" cy="55" r="42" fill="none" stroke="#EEEEEA" stroke-width="16"/>'+c+'<text x="55" y="57" text-anchor="middle" font-size="'+(String(center).length>2?20:24)+'" font-weight="800" fill="#111">'+esc(center)+'</text><text x="55" y="73" text-anchor="middle" font-size="11" fill="#595959">'+esc(sub)+'</text></svg>';
}
function ixCard(t,sub,parts,center,csub,label){
  return '<section class="ix-card"><div class="ix-h"><h2>'+t+'</h2><span class="ix-sub">'+esc(sub)+'</span></div><div class="ix-dn">'+ixDonut(parts,center,csub,label)+'<div class="ix-lg">'+parts.map(function(x){return '<div><i style="background:'+x.c+'"></i><span>'+esc(x.l)+'</span><b>'+x.v+'</b></div>'}).join('')+'</div></div></section>';
}

var auCtl=null;
async function preencherIA(){
  var rt=S.route;if(!rt||!S.sample)return;
  syncGrupos();
  var f=$('form[data-form="insp"]');if(!f)return;
  var fotos=[],rot=[],rn=[],gl=[];
  (rt.draft.grupos||[]).forEach(function(g,gi){if(g.ia===false)return;if((g.fotos||[]).length)gl.push({n:gi+1,titulo:g.titulo||'Registros'});(g.fotos||[]).forEach(function(id){fotos.push(id);rot.push(g.titulo||'Registros');rn.push(gi+1)})});
  if(!fotos.length){toast('Adicione fotos em um grupo marcado para a IA, como Registros das atividades.');return}
  var run=$('#au-run'),stop=$('#au-stop'),out=$('#au-out');
  run.disabled=true;stop.hidden=false;out.textContent='Analisando as fotos uma a uma…';
  auCtl=new AbortController();
  try{
    var caps=await S.sample.limits().catch(function(){return null});
    if(!(caps&&caps.images)){out.textContent='As fotos não puderam ser enviadas à IA nesta visualização.';return}
    var n=Math.min(fotos.length,20);
    var achados=[],obs=[],lidas=0,falhas=0,ultErr=null,mzI=[],mzE=[],mzA=[];
    for(var i=0;i<n;i++){
      if(S.route!==rt)return;
      if(auCtl.signal.aborted){var ce=new Error('cancelled');ce.code='cancelled';throw ce}
      out.textContent='Analisando a foto '+(i+1)+' de '+n+'… (uma por vez, pode levar alguns minutos)';
      var b=await fotoBlob(fotos[i]);

/* ---------- fotos ---------- */
function loadImg(src){return new Promise(function(res,rej){var im=(function(){var _i=new Image();_i.crossOrigin='anonymous';return _i})();im.onload=function(){res(im)};im.onerror=function(){rej(new Error('img'))};im.src=src})}
async function prepararFoto(file){
  var url=URL.createObjectURL(file);
  try{
    var im=await loadImg(url),max=1600,k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
    var w=Math.round(im.naturalWidth*k),h=Math.round(im.naturalHeight*k);
    var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
    var b=await new Promise(function(r){c.toBlob(r,'image/jpeg',0.82)});
    if(!b)throw new Error('blob');return b;
  }catch(e){
    if(/^image\/(jpeg|png|webp|gif)$/.test(file.type))return file;
    throw e;
  }finally{URL.revokeObjectURL(url)}
}
/* logomarca: nunca recomprimir como foto; PNG/JPEG/WebP até 3 MB sobem como estão, o resto vira PNG sem perda */
async function prepararLogo(file){
  if(/^image\/(png|jpeg|webp|svg\+xml)$/.test(file.type)&&file.size<=3*1024*1024)return file;
  var url=URL.createObjectURL(file);
  try{
    var im=await loadImg(url),k=Math.min(1,2000/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.round(im.naturalWidth*k),h=Math.round(im.naturalHeight*k);
    var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
    var b=await new Promise(function(r){c.toBlob(r,'image/png')});
    if(!b)throw new Error('blob');return b;
  }finally{URL.revokeObjectURL(url)}
}
/* logomarca nos documentos: PNG sem perda, fundo branco, até 1600 px (nítida em qualquer zoom) */
function imgLogo(id,dataUrl){
  return new Promise(function(res){
    var im=(function(){var _i=new Image();_i.crossOrigin='anonymous';return _i})();
    im.onload=function(){
      var k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.max(1,Math.round(im.naturalWidth*k)),h=Math.max(1,Math.round(im.naturalHeight*k));
      var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.imageSmoothingQuality='high';x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
      if(dataUrl){try{res({d:c.toDataURL('image/png'),w:w,h:h})}catch(e){res(null)}return}
      c.toBlob(function(b){if(!b){res(null);return}b.arrayBuffer().then(function(ab){res({d:new Uint8Array(ab),w:w,h:h})},function(){res(null)})},'image/png');
    };
    im.onerror=function(){res(null)};im.src=BLOB(id);
  });
}

function imgBytes(id){
  return new Promise(function(res){
    var im=(function(){var _i=new Image();_i.crossOrigin='anonymous';return _i})();
    im.onload=function(){
      var k=Math.min(1,1000/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.round(im.naturalWidth*k),h=Math.round(im.naturalHeight*k);
      var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
      c.toBlob(function(b){if(!b){res(null);return}b.arrayBuffer().then(function(ab){res({d:new Uint8Array(ab),w:w,h:h})},function(){res(null)})},'image/jpeg',0.78);
    };
    im.onerror=function(){res(null)};im.src=BLOB(id);
  });
}
/* ---------- Relatório de campo (modelo do cliente) — Word ---------- */
function linhasDe(t){return String(t==null?'':t).split(/\r?\n/).map(function(s){return s.replace(/^\s*(?:[-•*–]|\d+[.)])\s*/,'').trim()}).filter(Boolean)}
var MZ_F=[['REMOTA',2],['POUCO PROVÁVEL',3],['OCASIONAL',5],['PROVÁVEL',8],['FREQÜENTE',13]],MZ_S=[['CATASTRÓFICA',32],['CRÍTICA',16],['GRAVE',8],['MODERADA',4],['LEVE',2]];
var MZ_LEG=[['MUITO ALTO (160 ou mais)',160],['ALTO (80 a 128)',80],['MÉDIO (26 a 64)',26],['BAIXO (10 a 24)',10],['MUITO BAIXO (4 a 8)',0]];
function mzNorm(t){return String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/freq\w*ente/,'frequente').trim()}
function mzNivel(v){return v>=160?'muito alto':v>=80?'alto':v>=26?'médio':v>=10?'baixo':'muito baixo'}
/* classifica na matriz: a conta e a faixa são feitas aqui, não pela IA */
function mzClassifica(items){
  var mp={};
  (items||[]).forEach(function(it){
    if(!it||!it.risco)return;
    var si=-1,fi=-1;MZ_S.forEach(function(x,i){if(mzNorm(x[0])===mzNorm(it.severidade))si=i});MZ_F.forEach(function(x,i){if(mzNorm(x[0])===mzNorm(it.frequencia))fi=i});
    if(si<0||fi<0)return;
    var v=MZ_S[si][1]*MZ_F[fi][1],k=mzNorm(it.risco);
    if(!mp[k]||mp[k].v<v)mp[k]={risco:String(it.risco).trim(),sn:MZ_S[si][0],sp:MZ_S[si][1],fn:MZ_F[fi][0],fp:MZ_F[fi][1],v:v};
  });
  return Object.keys(mp).map(function(k){return mp[k]}).sort(function(a,b){return b.v-a.v}).slice(0,4);
}
function mzTexto(items,epis,alts){
  var R=mzClassifica(items),out=[];
  function cap(t){t=String(t||'').trim();return t.charAt(0).toUpperCase()+t.slice(1)}
  function lc(t){return String(t).toLowerCase()}
  if(R.length)out.push('Durante o acompanhamento das atividades, foi aplicada a matriz de riscos aos principais riscos observados nas fotos. '+R.map(function(r){return cap(r.risco)+': severidade ('+cap(lc(r.sn))+' = '+r.sp+') e frequência ('+cap(lc(r.fn))+' = '+r.fp+'), resultado '+r.v+', sendo considerado risco '+mzNivel(r.v)+'.'}).join(' '));
  else out.push('Nas fotos analisadas não foram identificados riscos relevantes para classificação na matriz de riscos.');
  function un(l,n){var o={};return (l||[]).map(function(x){return String(x||'').trim()}).filter(function(x){var k=lc(x);if(!x||o[k])return false;o[k]=1;return true}).slice(0,n)}
  var e=un(epis,2),a=un(alts,1);
  if(e.length)out.push(e.join(' '));
  if(a.length)out.push(a.join(' '));
  return out.join('\n\n');
}
function mzCor(v){return v>=160?['E5231B','FFFFFF']:v>=80?['F59A23','000000']:v>=26?['FFE600','000000']:v>=10?['8CC63F','000000']:['2E9E6E','FFFFFF']}
async function matrizBytes(){
  try{var r=await fetch('/matriz-riscos.png');if(!r.ok)return null;var u=new Uint8Array(await r.arrayBuffer());
    if(u.length<24||u[1]!==0x50)return null;
    return {d:u,w:((u[16]<<24)|(u[17]<<16)|(u[18]<<8)|u[19])>>>0,h:((u[20]<<24)|(u[21]<<16)|(u[22]<<8)|u[23])>>>0};

function normAch(a){
  a=(a&&typeof a==='object'&&!Array.isArray(a))?a:{};
  function t(x,n){return String(x==null?'':x).trim().slice(0,n||300)}
  function arr(x,n){return (Array.isArray(x)?x:[]).map(function(i){return t(i,400)}).filter(Boolean).slice(0,n)}
  var c=t(a.categoria).toLowerCase();if(!CAT[c])c='verificar';
  var g=t(a.grauRisco),p=t(a.prioridade),rf=(a.referencia&&typeof a.referencia==='object')?a.referencia:null;
  return {
    titulo:t(a.titulo,200),categoria:c,descricao:t(a.descricao,1500),
    grauRisco:GRAUS.indexOf(g)>-1?g:'',prioridade:PRIOS.indexOf(p)>-1?p:'',
    perigos:arr(a.perigosRiscos,6),medidas:arr(a.medidasControle,6),verificar:t(a.verificarPresencialmente,500),
    ref:(rf&&t(rf.norma))?{norma:t(rf.norma),edicao:t(rf.edicao),item:t(rf.item),subitem:t(rf.subitem),fonte:t(rf.fonte),vigencia:t(rf.vigencia)}:null,
    acoes:(Array.isArray(a.acoes)?a.acoes:[]).map(function(x){x=x||{};var d=Math.round(Number(x.prazoDias));return {acao:t(x.acao,400),prazoDias:(d>=1&&d<=365)?d:30}}).filter(function(x){return x.acao}).slice(0,4)
  };
}

    var im=(function(){var _i=new Image();_i.crossOrigin='anonymous';return _i})();

      var k=Math.min(1,1280/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.round(im.naturalWidth*k),h=Math.round(im.naturalHeight*k);

function promptIA(v,temFoto){
  return 'Você é engenheiro de segurança do trabalho no Brasil e está ajudando a revisar uma inspeção.\n\n'+
    'Contexto informado pelo inspetor:\n- Setor: '+(v.setor||'não informado')+'\n- Item: '+(v.titulo||'não informado')+'\n- Descrição: '+(v.descricao.slice(0,3000)||'não informada')+'\n\n'+
    (temFoto?'Tarefa: analise ESTA fotografia individualmente e liste até 8 achados (perigos e situações de risco), do mais ao menos relevante.\n\n':'Não há foto; analise somente o texto e liste até 8 achados.\n\n')+
    'Para cada achado, informe "categoria":\n- "observado": condição efetivamente visível na imagem;\n- "suspeita": possível condição que depende de confirmação;\n- "verificar": informação que só se confirma presencialmente (medições, documentos, treinamentos, estado interno de equipamentos).\n\n'+
    'Regras obrigatórias:\n- Não invente fatos que a imagem ou o texto não mostram. Se não houver achados claros, devolva a lista vazia.\n- Não identifique pessoas nem deduza dados de saúde de ninguém; descreva só a condição de trabalho.\n- Referência normativa: informe somente se tiver certeza da norma, do item e do subitem. Fontes possíveis: Normas Regulamentadoras (NR), ABNT NBR (apenas identificação e edição, sem reproduzir o texto), NHO da Fundacentro, Instruções Técnicas dos Corpos de Bombeiros, legislação estadual ou municipal. Preencha "norma", "edicao", "item", "subitem", "fonte" e "vigencia" (por exemplo "em vigor" ou "a confirmar"). Se não tiver certeza, use "referencia": null. Nunca invente requisitos legais, itens, números ou artigos.\n- "grauRisco" deve ser exatamente Crítico, Alto, Médio ou Baixo. "prioridade" deve ser exatamente Alta, Média ou Baixa.\n- Escreva em português do Brasil, de forma objetiva.\n\n'+
    'Responda somente com um objeto JSON neste formato:\n{"achados":[{"titulo":"texto curto","categoria":"observado","descricao":"o que se vê e qual o risco","grauRisco":"Alto","prioridade":"Alta","perigosRiscos":["..."],"referencia":{"norma":"NR-35","edicao":"","item":"","subitem":"","fonte":"","vigencia":""},"medidasControle":["..."],"verificarPresencialmente":"...","acoes":[{"acao":"medida corretiva","prazoDias":15}]}]}';

async function analisarIA(){
  var rt=S.route;if(!rt||!S.sample)return;
  var f=$('form[data-form="nc"]');if(!f)return;
  var run=$('#ia-run'),stop=$('#ia-stop'),out=$('#ia-out');
  var v={setor:f.elements.setor.value.trim(),titulo:f.elements.titulo.value.trim(),descricao:f.elements.descricao.value.trim()};
  var fotos=rt.draft.fotos||[];
  if(!fotos.length&&!v.titulo&&!v.descricao){toast('Anexe fotos ou descreva o item para a IA analisar.');return}
  run.disabled=true;stop.hidden=false;
  iaCtl=new AbortController();
  var res=[],aviso='';
  try{
    var caps=await S.sample.limits().catch(function(){return null});
    var imgOK=!!(caps&&caps.images);
    var lista=(fotos.length&&imgOK)?fotos.slice(0,6):[null];
    if(fotos.length&&!imgOK)aviso='As fotos não puderam ser enviadas à IA nesta visualização. A análise usou só o texto.';
    else if(fotos.length>6)aviso='A IA analisou as 6 primeiras fotos.';
    for(var k=0;k<lista.length;k++){
      if(S.route!==rt)return;
      out.textContent='Analisando '+(lista[k]?'a foto '+(k+1)+' de '+lista.length:'o texto informado')+'… pode levar alguns segundos.';
      var blob=lista[k]?await fotoBlob(lista[k]):null;
      var o={signal:iaCtl.signal};if(blob)o.images=[blob];
      var r=await S.sample.json(promptIA(v,!!blob),o);
      res.push({foto:lista[k],n:k+1,achados:normIA(r)});
    }
    if(S.route!==rt)return;
    rt.draft.iaRes=res;rt.draft.iaAviso=aviso;out.innerHTML=iaOut(rt.draft);

    case 'ia-stop':if(iaCtl)iaCtl.abort();break;
    case 'ia-use':usarAchado(+el.dataset.p,+el.dataset.a);break;

    case 'zoom':var lb=$('#lightbox');lb.innerHTML='<img src="'+BLOB(esc(id))+'" alt="Foto ampliada"><button type="button" class="btn btn-primary" data-act="zoom-close">Fechar</button>';lb.hidden=false;lb.querySelector('button').focus();break;
    case 'zoom-close':$('#lightbox').hidden=true;break;

      syncDraft();var bk=el.closest('[data-item-blk]'),ix=[].indexOf.call(document.querySelectorAll('[data-item-blk]'),bk),itm=S.route.draft.itens[ix];

    case 'foto-in':if(el.files&&el.files.length)addFotos(Array.prototype.slice.call(el.files));break;
    case 'acao-status':
      var a=S.acoes.filter(function(x){return x.id===el.dataset.id})[0];if(!a)break;
      S.db.doc('acoes/'+a.id).update({status:el.value,concluidaEm:el.value==='Concluída'?hoje():'',atualizadoEm:Date.now()}).catch(function(er){console.error(er);toast('Não foi possível alterar a situação.')});
      break;
  }
});
function cnpjNum(x){return String(x||'').replace(/\D/g,'')}
function cnpjFmt(x){var n=cnpjNum(x);return n.length===14?n.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,'$1.$2.$3/$4-$5'):String(x||'').trim()}
function cnpjOk(x){var n=cnpjNum(x);if(n.length!==14||/^(\d)\1+$/.test(n))return false;
  function dv(t){var p=t-7,sm=0;for(var i=0;i<t;i++){sm+=+n[i]*p--;if(p<2)p=9}var r=sm%11;return r<2?0:11-r}
  return dv(12)===+n[12]&&dv(13)===+n[13]}
document.addEventListener('input',function(e){
  if(e.target&&(e.target.id==='e-cnpj'||e.target.id==='i-execCnpj')){var d=cnpjNum(e.target.value).slice(0,14),o=d;
    if(d.length>12)o=d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{0,2})$/,'$1.$2.$3/$4-$5');
    else if(d.length>8)o=d.replace(/^(\d{2})(\d{3})(\d{3})(\d{0,4})$/,'$1.$2.$3/$4');
    else if(d.length>5)o=d.replace(/^(\d{2})(\d{3})(\d{0,3})$/,'$1.$2.$3');
    else if(d.length>2)o=d.replace(/^(\d{2})(\d{0,3})$/,'$1.$2');
    e.target.value=o;return}
  var el=e.target.closest('[data-inp]');if(!el)return;
  var k=el.dataset.inp;
  if(k==='busca'){buscar(el.value);return}
  if(k==='ac-q'){acessoBusca(el.value);return}
  S.f.q=el.value;
  if(k==='q-insp')$('#lista').innerHTML=listaInsp();
  else if(k==='q-nc')$('#lista').innerHTML=listaNc();
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape')return;
  var nm=$('#nav');if(nm&&nm.classList.contains('open')){nm.classList.remove('open');$('#menu-bg').hidden=true;$('#fab').setAttribute('aria-expanded','false')}

$('#lightbox').addEventListener('click',function(e){if(e.target.id==='lightbox')this.hidden=true});
window.addEventListener('hashchange',function(){autoGuarda();if(S.skipHash){S.skipHash=false;return}S.f.q='';onHash()});

/* ---------- acessos ---------- */
function acessoBusca(q){
  var box=$('#ac-hits');if(!box||!S.user||!S.user.search)return;
  S.user.search(q).then(function(hits){
    var cur=(S.acessos&&S.acessos.usuarios)||{};
    hits=(hits||[]).filter(function(h){return h.id&&h.id!==S.me.id&&!cur[h.id]}).slice(0,6);
    box.innerHTML=hits.length?hits.map(function(h){return '<button type="button" class="row" data-act="ac-add" data-id="'+esc(h.id)+'" data-nome="'+esc(h.name)+'"><span>'+esc(h.name)+'</span><span class="btn btn-ghost" aria-hidden="true">Vincular</span></button>'}).join(''):(q.trim()?'<p class="muted small pad">Ninguém encontrado.</p>':'');
  });
}
async function acessoSet(id,patch){
  var us=Object.assign({},(S.acessos&&S.acessos.usuarios)||{});
  us[id]=Object.assign({},us[id]||{},patch);
  try{await S.db.doc('config/acessos').set({usuarios:us});var b=$('#ac-hits');if(b)b.innerHTML='';var q=$('#ac-q');if(q)q.value=''}catch(e){console.error(e);toast('Não foi possível salvar o acesso.')}
}
async function acessoRm(id){
  var us=Object.assign({},(S.acessos&&S.acessos.usuarios)||{});delete us[id];
  try{await S.db.doc('config/acessos').set({usuarios:us})}catch(e){console.error(e);toast('Não foi possível remover o acesso.')}
}

/* ---------- início ---------- */
function refresh(){
  migra();
  if(S.route&&S.route.name==='insp-form'&&S.lastEmp!==S.empresas.length){S.lastEmp=S.empresas.length;syncDraft();renderMain();return}
  S.lastEmp=S.empresas.length;
  if(S.route&&/-form$/.test(S.route.name)){renderNav();return}
  renderMain();
}
function falha(err){console.error(err);S.dbFail=true;renderMain()}
function assina(nome,chave,alvo){
  S.db.collection(nome).onSnapshot(function(snap){
    S.R[alvo]=snap.docs.map(function(d){var o=d.data();o.id=d.id;return o});
    S.loaded[chave]=true;escopo();refresh();
  },falha);
}
document.addEventListener('invalid',function(e){var f=e.target,l=f.id&&document.querySelector('label[for="'+f.id+'"]');toast('Preencha: '+(l?l.textContent.replace('*','').trim():'campo obrigatório')+'.');try{f.scrollIntoView({block:'center'})}catch(x){}},true);
shell();onHash();
S.t0=Date.now();
window.addEventListener('error',function(e){S.err=e.message||'erro';if(!ready())renderMain()});
window.addEventListener('unhandledrejection',function(e){S.err=String(e.reason&&e.reason.message||e.reason||'erro');if(!ready())renderMain()});
var espera=setInterval(function(){
  if(ready()){clearInterval(espera);return}
  var t=Date.now()-S.t0;
  if(t>7000){Object.keys(S.loaded).forEach(function(k){S.loaded[k]=true});escopo();clearInterval(espera)}
  renderMain();
},1000);
(function(){
  var c=window.claude;
  if(!c||!c.use){S.dbFail=true;renderMain();return}
  function tmo(p,ms){return Promise.race([Promise.resolve(p),new Promise(function(r){setTimeout(function(){r(null)},ms)})]).catch(function(){return null})}
  c.use('db').then(function(db){
    S.db=db;
    if(!db){S.dbFail=true;renderMain();return}
    assina('inspecoes','i','insp');assina('ncs','n','ncs');assina('acoes','a','acoes');assina('empresas','e','empresas');assina('contratos','k','contratos');assina('usuarios','u','usuarios');
    S.db.doc('config/acessos').onSnapshot(function(snap){S.acessos=snap.exists?snap.data():null;S.loaded.x=true;escopo();refresh()},falha);
    S.db.doc('config/marca').onSnapshot(function(snap){S.marca=snap.exists?snap.data():null;refresh()},falha);
  S.db.doc('config/cadastros').onSnapshot(function(snap){S.cad=snap.exists?snap.data():null;S.loaded.c=true;refresh()},falha);
  }).catch(falha);
  tmo(c.use('assets'),8000).then(function(a){S.assets=a;if(S.route)renderMain()});
  tmo(c.use('downloads'),8000).then(function(a){S.downloads=a});
  tmo(c.use('sample'),8000).then(function(a){S.sample=a});
  tmo((async function(){
    var u=await c.use('user');
    if(!u)return null;
    var r=await Promise.all([u.isOwner(),u.canEdit(),u.me()]);
    return {u:u,ow:r[0],ed:r[1],me:r[2]};
  })(),8000).then(function(r){
    if(r){
      S.user=r.u;S.me={id:r.me&&r.me.id||'',name:r.me&&r.me.name||''};
      S.perfil=r.ow?(window.SEVIA_PERFIL==='Técnico ADM'?'Técnico ADM':'Administradora'):(r.ed?'Técnico SST':'Cliente/ADM');S.canWrite=r.ow||r.ed;
    }
    $('#app').classList.toggle('ro',!S.canWrite);
    S.loaded.p=true;escopo();refresh();setTimeout(restauraRascunho,800);
  });
})();
})();
</script>
<script>
/* Bloqueio por inatividade: sai do sistema depois de alguns minutos sem uso. */
(function(){
  var LIMITE=5*60*1000, AVISO=60*1000, ultimo=Date.now(), aviso=null, saindo=false;
  function sair(){if(saindo)return;saindo=true;try{if(window.__seviaRascunho)window.__seviaRascunho()}catch(e){}try{sessionStorage.setItem('sevia.inativo','1')}catch(e){}
    if(window.SEVIA_SAIR)window.SEVIA_SAIR();else location.replace('login.html')}
  function fechaAviso(){if(aviso){aviso.remove();aviso=null}}
  function atividade(){if(saindo)return;ultimo=Date.now();fechaAviso()}
  ['pointerdown','keydown','touchstart','scroll','input','click'].forEach(function(ev){window.addEventListener(ev,atividade,{passive:true,capture:true})});
  function mostraAviso(seg){
    if(!aviso){aviso=document.createElement('div');aviso.setAttribute('role','alertdialog');
      aviso.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px';
      aviso.innerHTML='<div style="background:#fff;color:#111;border-radius:14px;max-width:340px;width:100%;padding:20px;font:16px/1.4 system-ui,sans-serif"><h2 style="margin:0 0 8px;font-size:18px">Você ainda está aí?</h2><p style="margin:0 0 16px">Por segurança, o SevIA vai sair em <b id="ina-s"></b> segundos por falta de uso.</p><button type="button" id="ina-ok" style="width:100%;padding:12px;border:0;border-radius:10px;background:#0a5;color:#fff;font:600 16px system-ui">Continuar conectada</button></div>';
      document.body.appendChild(aviso);
      aviso.querySelector('#ina-ok').addEventListener('click',function(e){e.stopPropagation();atividade()})}
    var el=aviso.querySelector('#ina-s');if(el)el.textContent=seg}
  function confere(){
    if(saindo)return;
    var parado=Date.now()-ultimo;
    if(parado>=LIMITE){sair();return}
    if(parado>=LIMITE-AVISO)mostraAviso(Math.max(1,Math.ceil((LIMITE-parado)/1000)));
  }
  setInterval(confere,1000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)confere()});
})();
</script>
